<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/script.js"></script>
</head>
<body>
    <div id="title">
        <h1>Welcome to URL Shortener</h1>
        <p>by Restu Manujaya</p>
    </div>
    <div class="container" sty>
        <p>A simple url shortener built in Python and Flask. Just entered a random valid url, and let the system create a new short url.</p>
        <div id="url-container">
            <label for="link">URL:</label>
            <input type="text" id="url-input" name="url" placeholder="Enter url...">
            <button id="url-button">Shorten it!</button>
        </div>
        <p id="shorten-url">Shorten URL: -</p>
    </div>
</body>
</html>
